[package]
name = "a2a-sidecar"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
hyper = { version = "0.14", features = ["full"] }
hyperlocal = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Phase C: libp2p bring-up (transport substrate)
libp2p = { version = "0.53", features = ["tokio", "tcp", "dns", "noise", "yamux", "quic", "ping", "request-response", "macros"] }
futures = "0.3"
async-trait = "0.1"
libp2p-request-response = { version = "0.26.3", features = ["json"] }

# Scheme A: custom substream protocol (explicit deps for handler/upgrades)
libp2p-swarm = "0.44"
libp2p-core = "0.41"
bytes = "1"

